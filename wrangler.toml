# StoryForge isolated staging Worker configuration.
# This root-level file is used by Cloudflare Workers Builds (root_directory = "/").
# Never change this file to point at the Production Worker or Production D1 database.

name = "storyforge-staging"
main = "cloudflare/worker.js"
compatibility_date = "2026-11-22"
workers_dev = true
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/auth/*"]

[[d1_databases]]
binding = "DB"
database_name = "storyforge-staging"
database_id = "5e1f1b05-c14e-481c-9f32-190fd61e908a"
migrations_dir = "cloudflare/migrations"
