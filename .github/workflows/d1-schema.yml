name: StoryForge validation

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check JavaScript syntax
        run: |
          node --input-type=module --check < cloudflare/worker.js
          node --check public/app.js
      - name: Validate D1 schema
        run: python tests/check_d1_schema.py
      - name: Validate Worker security contract
        run: python tests/check_worker_contract.py
