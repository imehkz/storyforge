name: D1 schema checks

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate D1-compatible migrations
        run: python tests/check_d1_schema.py
